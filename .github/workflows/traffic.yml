name: Traffic Collector

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Шаг 1: Checkout main (для скрипта генератора)
      # ─────────────────────────────────────────────
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # ─────────────────────────────────────────────
      # Шаг 2: Определяем временную директорию
      # ─────────────────────────────────────────────
      - name: Set temp directory
        id: temp
        shell: bash
        run: |
          echo "dir=${RUNNER_TEMP}/traffic-tmp" >> "$GITHUB_OUTPUT"

      - name: Create temp directory
        shell: bash
        run: |
          mkdir -p "${{ steps.temp.outputs.dir }}/snapshots"
          mkdir -p "${{ steps.temp.outputs.dir }}/charts"

      # ─────────────────────────────────────────────
      # Шаг 3: Собираем данные API во временную папку
      # ─────────────────────────────────────────────
      - name: Collect GitHub traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(date -u +%Y-%m-%d)"
          REPOSITORY="${{ github.repository }}"
          TMP_DIR="${{ steps.temp.outputs.dir }}"

          gh api "repos/${REPOSITORY}/traffic/views" \
            --jq '.views' \
            > "${TMP_DIR}/snapshots/views-${DATE}.json"

          gh api "repos/${REPOSITORY}/traffic/clones" \
            --jq '.clones' \
            > "${TMP_DIR}/snapshots/clones-${DATE}.json"

          gh api "repos/${REPOSITORY}/traffic/popular/referrers" \
            > "${TMP_DIR}/snapshots/referrers-${DATE}.json"

          gh api "repos/${REPOSITORY}/traffic/popular/paths" \
            > "${TMP_DIR}/snapshots/paths-${DATE}.json"

          echo "Collected files:"
          ls -la "${TMP_DIR}/snapshots/"

      # ─────────────────────────────────────────────
      # Шаг 4: Генерируем SVG из скрипта main
      # ─────────────────────────────────────────────
      - name: Generate SVG charts
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="${{ steps.temp.outputs.dir }}"

          # Создаём временную структуру для скрипта
          mkdir -p traffic/snapshots
          cp "${TMP_DIR}/snapshots/"*.json traffic/snapshots/

          # Запускаем генератор
          python3 scripts/generate_traffic_svg.py

          # Копируем результат во временную директорию
          cp traffic/charts/*.svg "${TMP_DIR}/charts/"

          echo "Generated charts:"
          ls -la "${TMP_DIR}/charts/"

      # ─────────────────────────────────────────────
      # Шаг 5: Переключаемся на traffic-data
      # ─────────────────────────────────────────────
      - name: Switch to traffic-data branch
        shell: bash
        run: |
          set -euo pipefail

          # Чистим рабочую директорию
          rm -rf traffic scripts .github

          if git ls-remote --exit-code --heads origin traffic-data >/dev/null 2>&1; then
            git fetch origin traffic-data
            git checkout traffic-data
          else
            git checkout --orphan traffic-data
            git rm -rf . || true
            git clean -fd
          fi

      # ─────────────────────────────────────────────
      # Шаг 6: Переносим данные из tmp и коммитим
      # ─────────────────────────────────────────────
      - name: Move data into place
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="${{ steps.temp.outputs.dir }}"

          mkdir -p traffic/snapshots traffic/charts

          # Копируем новые snapshots (не перезаписываем существующие)
          cp --update=none "${TMP_DIR}/snapshots/"*.json traffic/snapshots/ || true

          # Перезаписываем SVG (они всегда свежие)
          cp "${TMP_DIR}/charts/"*.svg traffic/charts/

          echo "Final structure:"
          ls -la traffic/snapshots/ | tail -5
          ls -la traffic/charts/

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add traffic/

          if git diff --cached --quiet; then
            echo "No traffic changes."
            exit 0
          fi

          git commit -m "chore: collect traffic $(date -u +%Y-%m-%d)"
          git pull --rebase origin traffic-data || true
          git push origin HEAD:traffic-data
