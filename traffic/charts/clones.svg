<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones: daily and cumulative"
>
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #1f2937;
    }

    .legend {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 7px;
      fill: #6b7280;
    }

    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 8px;
      fill: #6b7280;
    }

    .grid {
      stroke: #e5e7eb;
      stroke-width: 1;
    }

    .daily {
      fill: none;
      stroke: #315f9f;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cumulative {
      fill: none;
      stroke: #9ca3af;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 3 2;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #e5e7eb;
      }

      .legend,
      .label {
        fill: #9ca3af;
      }

      .grid {
        stroke: #374151;
      }

      .daily {
        stroke: #8fb5e8;
      }

      .cumulative {
        stroke: #9ca3af;
      }
    }
  </style>

  <text
    x="36"
    y="12"
    class="title"
  >GitHub clones</text>

  <line
    x1="36"
    y1="98"
    x2="244"
    y2="98"
    class="grid"
  />

  <line
    x1="36"
    y1="17"
    x2="46"
    y2="17"
    class="daily"
  />

  <text
    x="49"
    y="19"
    class="legend"
  >daily</text>

  <line
    x1="84"
    y1="17"
    x2="94"
    y2="17"
    class="cumulative"
  />

  <text
    x="97"
    y="19"
    class="legend"
  >cumulative</text>

  <polyline
    points="36.0,98.0 52.0,98.0 68.0,98.0 84.0,98.0 100.0,98.0 116.0,98.0 132.0,98.0 148.0,98.0 164.0,98.0 180.0,98.0 196.0,80.1 212.0,62.9 228.0,40.3 244.0,24.0"
    class="cumulative"
  />

  <polyline
    points="36.0,98.0 52.0,98.0 68.0,98.0 84.0,98.0 100.0,98.0 116.0,98.0 132.0,98.0 148.0,98.0 164.0,98.0 180.0,98.0 196.0,39.4 212.0,41.7 228.0,24.0 244.0,44.7"
    class="daily"
  />

  <text
    x="36"
    y="108"
    class="label"
  >2026-07-27</text>

  <text
    x="244"
    y="108"
    text-anchor="end"
    class="label"
  >2026-08-09</text>

  <text
    x="32"
    y="31"
    text-anchor="end"
    class="label"
  >197</text>

  <text
    x="248"
    y="31"
    class="label"
  >645</text>

  <text
    x="244"
    y="14"
    text-anchor="end"
    class="label"
  >Σ 645</text>
</svg>
