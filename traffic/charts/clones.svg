<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones"
>
  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #24292f;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #6e7781;
    }

    .value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      font-weight: 600;
    }

    .daily-line {
      fill: none;
      stroke: #57606a;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cumulative-line {
      fill: none;
      stroke: #0969da;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .daily-point {
      fill: #57606a;
    }

    .cumulative-point {
      fill: #0969da;
    }

    .legend {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 7px;
      fill: #6e7781;
    }
  </style>

  <!-- Title -->
  <text
    x="36"
    y="12"
    class="title"
  >GitHub clones</text>

  <!-- Legend -->
  <line
    x1="36"
    y1="19"
    x2="45"
    y2="19"
    class="daily-line"
  />

  <text
    x="48"
    y="21.5"
    class="legend"
  >Daily</text>

  <line
    x1="83"
    y1="19"
    x2="92"
    y2="19"
    class="cumulative-line"
  />

  <text
    x="95"
    y="21.5"
    class="legend"
  >Cumulative</text>

  <!-- Daily line -->
  <polyline
    points="36.0,98.0 54.0,98.0 72.0,98.0 90.0,98.0 108.0,98.0 126.0,98.0 144.0,98.0 162.0,98.0 180.0,98.0 198.0,98.0 216.0,39.4 234.0,41.7 252.0,24.0 270.0,44.7"
    class="daily-line"
  />

  <!-- Cumulative line -->
  <polyline
    points="36.0,98.0 54.0,98.0 72.0,98.0 90.0,98.0 108.0,98.0 126.0,98.0 144.0,98.0 162.0,98.0 180.0,98.0 198.0,98.0 216.0,80.1 234.0,62.9 252.0,40.3 270.0,24.0"
    class="cumulative-line"
  />

  <!-- Daily endpoint -->
  <circle
    cx="270.0"
    cy="44.7"
    r="2"
    class="daily-point"
  />

  <text
    x="266.0"
    y="45.7"
    text-anchor="end"
    class="value"
    fill="#57606a"
  >142</text>

  <!-- Cumulative endpoint -->
  <circle
    cx="270.0"
    cy="24.0"
    r="2"
    class="cumulative-point"
  />

  <text
    x="266.0"
    y="32.0"
    text-anchor="end"
    class="value"
    fill="#0969da"
  >645</text>

  <!-- Date range -->
  <text
    x="36"
    y="112"
    class="label"
  >2026-07-27</text>

  <text
    x="270"
    y="112"
    text-anchor="end"
    class="label"
  >2026-08-09</text>
</svg>
