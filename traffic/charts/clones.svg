<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #475569;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      fill: #94a3b8;
    }

    .legend {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #475569;
    }

    .daily-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #2563eb;
    }

    .total-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #64748b;
    }
  </style>

  <!-- ======================================================
       Заголовок
       ====================================================== -->

  <text
    x="36"
    y="13"
    class="title"
  >
    GitHub clones
  </text>


  <!-- ======================================================
       Легенда
       ====================================================== -->

  <line
    x1="118"
    y1="9"
    x2="127"
    y2="9"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="131"
    y="12"
    class="legend"
  >
    Daily
  </text>

  <line
    x1="164"
    y1="9"
    x2="173"
    y2="9"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="177"
    y="12"
    class="legend"
  >
    Total
  </text>


  <!-- ======================================================
       Нижняя базовая линия
       ====================================================== -->

  <line
    x1="36"
    y1="98"
    x2="238"
    y2="98"
    stroke="#e2e8f0"
    stroke-width="1"
  />


  <!-- ======================================================
       Daily
       ====================================================== -->

  <polyline
    points="36.0,94.8 51.5,94.8 67.1,56.2 82.6,75.5 98.2,81.9 113.7,72.3 129.2,85.1 144.8,53.0 160.3,78.7 175.8,88.3 191.4,75.5 206.9,65.8 222.5,24.0 238.0,72.3"
    fill="none"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="72.3"
    r="2.5"
    fill="#2563eb"
  />


  <!-- ======================================================
       Total
       ====================================================== -->

  <polyline
    points="36.0,97.3 51.5,96.7 67.1,87.9 82.6,83.2 98.2,79.8 113.7,74.5 129.2,71.8 144.8,62.3 160.3,58.3 175.8,56.3 191.4,51.6 206.9,44.9 222.5,29.4 238.0,24.0"
    fill="none"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="24.0"
    r="2.5"
    fill="#64748b"
  />


  <!-- ======================================================
       Конечные значения
       
       ВАЖНО:
       подписи находятся СПРАВА от точек, а не слева.
       
       latest_x + 6 гарантирует зазор между точкой и текстом.
       Дополнительный PADDING_RIGHT гарантирует, что текст
       остаётся внутри SVG.
       ====================================================== -->

  <text
    x="244.0"
    y="75.3"
    class="daily-value"
  >
    8
  </text>

  <text
    x="244.0"
    y="27.0"
    class="total-value"
  >
    110
  </text>


  <!-- ======================================================
       Даты
       ====================================================== -->

  <text
    x="36"
    y="113"
    class="label"
  >
    2026-08-30
  </text>

  <text
    x="238"
    y="113"
    text-anchor="end"
    class="label"
  >
    2026-09-12
  </text>

</svg>
