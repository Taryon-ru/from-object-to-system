<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones"
>
  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #333;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #888;
    }

    .value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #333;
    }

    .daily-line {
      fill: none;
      stroke: #315a9b;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cumulative-line {
      fill: none;
      stroke: #777;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4 3;
    }

    .daily-point {
      fill: #315a9b;
    }

    .cumulative-point {
      fill: #777;
    }
  </style>

  <text
    x="36"
    y="16"
    class="title"
  >
    GitHub clones
  </text>

  <polyline
    points="36.0,98.0 54.0,98.0 72.0,98.0 90.0,98.0 108.0,98.0 126.0,98.0 144.0,98.0 162.0,98.0 180.0,98.0 198.0,98.0 216.0,80.1 234.0,80.8 252.0,75.4 270.0,81.7"
    class="daily-line"
  />

  <polyline
    points="36.0,98.0 54.0,98.0 72.0,98.0 90.0,98.0 108.0,98.0 126.0,98.0 144.0,98.0 162.0,98.0 180.0,98.0 198.0,98.0 216.0,80.1 234.0,62.9 252.0,40.3 270.0,24.0"
    class="cumulative-line"
  />

  <circle
    cx="270.0"
    cy="81.7"
    r="2.5"
    class="daily-point"
  />

  <circle
    cx="270.0"
    cy="24.0"
    r="2.5"
    class="cumulative-point"
  />

  <text
    x="242.0"
    y="85.7"
    class="value"
  >
    142
  </text>

  <text
    x="242.0"
    y="28.0"
    class="value"
  >
    645
  </text>

  <text
    x="36"
    y="112"
    class="label"
  >
    2026-07-27
  </text>

  <text
    x="270"
    y="112"
    text-anchor="end"
    class="label"
  >
    2026-08-09
  </text>
</svg>
