<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones: daily and cumulative"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #374151;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #6b7280;
    }

    .value-daily {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      font-weight: 600;
      fill: #315f9f;
    }

    .value-cumulative {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      font-weight: 600;
      fill: #7b8794;
    }

    .legend {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 7px;
      fill: #6b7280;
    }
  </style>

  <!-- Title -->

  <text
    x="36"
    y="10"
    class="title"
  >GitHub clones</text>


  <!-- Legend -->

  <line
    x1="36"
    y1="17"
    x2="45"
    y2="17"
    stroke="#315f9f"
    stroke-width="2"
  />

  <text
    x="48"
    y="19.5"
    class="legend"
  >daily</text>

  <line
    x1="88"
    y1="17"
    x2="97"
    y2="17"
    stroke="#7b8794"
    stroke-width="1.5"
  />

  <text
    x="100"
    y="19.5"
    class="legend"
  >cumulative</text>


  <!-- Grid -->

  <line
    x1="36"
    y1="98"
    x2="244"
    y2="98"
    stroke="#d9dee5"
    stroke-width="0.7"
  />


  <!-- Daily clones -->

  <polyline
    points="36.0,98.0 52.0,98.0 68.0,98.0 84.0,98.0 100.0,98.0 116.0,98.0 132.0,98.0 148.0,98.0 164.0,98.0 180.0,98.0 196.0,39.4 212.0,41.7 228.0,24.0 244.0,44.7"
    fill="none"
    stroke="#315f9f"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


  <!-- Cumulative clones -->

  <polyline
    points="36.0,98.0 52.0,98.0 68.0,98.0 84.0,98.0 100.0,98.0 116.0,98.0 132.0,98.0 148.0,98.0 164.0,98.0 180.0,98.0 196.0,80.1 212.0,62.9 228.0,40.3 244.0,24.0"
    fill="none"
    stroke="#7b8794"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


  <!-- Latest daily point -->

  <circle
    cx="244.0"
    cy="44.7"
    r="2"
    fill="#315f9f"
  />

  <text
    x="240.0"
    y="34.0"
    class="value-daily"
  >142</text>


  <!-- Latest cumulative point -->

  <circle
    cx="244.0"
    cy="24.0"
    r="1.8"
    fill="#7b8794"
  />

  <text
    x="240.0"
    y="41.0"
    class="value-cumulative"
  >645</text>


  <!-- Dates -->

  <text
    x="36"
    y="113"
    class="label"
  >2026-07-27</text>

  <text
    x="244"
    y="113"
    text-anchor="end"
    class="label"
  >2026-08-09</text>

</svg>
