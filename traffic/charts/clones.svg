<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #475569;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      fill: #94a3b8;
    }

    .legend {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #475569;
    }

    .daily-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #2563eb;
    }

    .total-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #64748b;
    }
  </style>

  <!-- ======================================================
       Заголовок
       ====================================================== -->

  <text
    x="36"
    y="13"
    class="title"
  >
    GitHub clones
  </text>


  <!-- ======================================================
       Легенда
       ====================================================== -->

  <line
    x1="118"
    y1="9"
    x2="127"
    y2="9"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="131"
    y="12"
    class="legend"
  >
    Daily
  </text>

  <line
    x1="164"
    y1="9"
    x2="173"
    y2="9"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="177"
    y="12"
    class="legend"
  >
    Total
  </text>


  <!-- ======================================================
       Нижняя базовая линия
       ====================================================== -->

  <line
    x1="36"
    y1="98"
    x2="238"
    y2="98"
    stroke="#e2e8f0"
    stroke-width="1"
  />


  <!-- ======================================================
       Daily
       ====================================================== -->

  <polyline
    points="36.0,88.1 51.5,83.2 67.1,24.0 82.6,48.7 98.2,48.7 113.7,78.3 129.2,83.2 144.8,78.3 160.3,88.1 175.8,93.1 191.4,63.5 206.9,88.1 222.5,53.6 238.0,93.1"
    fill="none"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="93.1"
    r="2.5"
    fill="#2563eb"
  />


  <!-- ======================================================
       Total
       ====================================================== -->

  <polyline
    points="36.0,96.0 51.5,92.9 67.1,77.7 82.6,67.6 98.2,57.5 113.7,53.4 129.2,50.4 144.8,46.3 160.3,44.3 175.8,43.3 191.4,36.2 206.9,34.1 222.5,25.0 238.0,24.0"
    fill="none"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="24.0"
    r="2.5"
    fill="#64748b"
  />


  <!-- ======================================================
       Конечные значения
       
       ВАЖНО:
       подписи находятся СПРАВА от точек, а не слева.
       
       latest_x + 6 гарантирует зазор между точкой и текстом.
       Дополнительный PADDING_RIGHT гарантирует, что текст
       остаётся внутри SVG.
       ====================================================== -->

  <text
    x="244.0"
    y="96.1"
    class="daily-value"
  >
    1
  </text>

  <text
    x="244.0"
    y="27.0"
    class="total-value"
  >
    73
  </text>


  <!-- ======================================================
       Даты
       ====================================================== -->

  <text
    x="36"
    y="113"
    class="label"
  >
    2026-10-17
  </text>

  <text
    x="238"
    y="113"
    text-anchor="end"
    class="label"
  >
    2026-10-30
  </text>

</svg>
