<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #475569;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      fill: #94a3b8;
    }

    .legend {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #475569;
    }

    .daily-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #2563eb;
    }

    .total-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #64748b;
    }
  </style>

  <!-- ======================================================
       Заголовок
       ====================================================== -->

  <text
    x="36"
    y="13"
    class="title"
  >
    GitHub clones
  </text>


  <!-- ======================================================
       Легенда
       ====================================================== -->

  <line
    x1="118"
    y1="9"
    x2="127"
    y2="9"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="131"
    y="12"
    class="legend"
  >
    Daily
  </text>

  <line
    x1="164"
    y1="9"
    x2="173"
    y2="9"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="177"
    y="12"
    class="legend"
  >
    Total
  </text>


  <!-- ======================================================
       Нижняя базовая линия
       ====================================================== -->

  <line
    x1="36"
    y1="98"
    x2="238"
    y2="98"
    stroke="#e2e8f0"
    stroke-width="1"
  />


  <!-- ======================================================
       Daily
       ====================================================== -->

  <polyline
    points="36.0,92.7 51.5,39.9 67.1,24.0 82.6,61.0 98.2,92.7 113.7,87.4 129.2,87.4 144.8,92.7 160.3,92.7 175.8,66.3 191.4,87.4 206.9,92.7 222.5,92.7 238.0,29.3"
    fill="none"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="29.3"
    r="2.5"
    fill="#2563eb"
  />


  <!-- ======================================================
       Total
       ====================================================== -->

  <polyline
    points="36.0,96.8 51.5,83.9 67.1,67.5 82.6,59.2 98.2,58.1 113.7,55.7 129.2,53.4 144.8,52.2 160.3,51.0 175.8,44.0 191.4,41.6 206.9,40.4 222.5,39.3 238.0,24.0"
    fill="none"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="24.0"
    r="2.5"
    fill="#64748b"
  />


  <!-- ======================================================
       Конечные значения
       
       ВАЖНО:
       подписи находятся СПРАВА от точек, а не слева.
       
       latest_x + 6 гарантирует зазор между точкой и текстом.
       Дополнительный PADDING_RIGHT гарантирует, что текст
       остаётся внутри SVG.
       ====================================================== -->

  <text
    x="244.0"
    y="38.3"
    class="daily-value"
  >
    13
  </text>

  <text
    x="244.0"
    y="21.0"
    class="total-value"
  >
    63
  </text>


  <!-- ======================================================
       Даты
       ====================================================== -->

  <text
    x="36"
    y="113"
    class="label"
  >
    2026-08-19
  </text>

  <text
    x="238"
    y="113"
    text-anchor="end"
    class="label"
  >
    2026-09-01
  </text>

</svg>
