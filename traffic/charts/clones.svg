<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #475569;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      fill: #94a3b8;
    }

    .legend {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #475569;
    }

    .daily-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #2563eb;
    }

    .total-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #64748b;
    }
  </style>

  <!-- ======================================================
       Заголовок
       ====================================================== -->

  <text
    x="36"
    y="13"
    class="title"
  >
    GitHub clones
  </text>


  <!-- ======================================================
       Легенда
       ====================================================== -->

  <line
    x1="118"
    y1="9"
    x2="127"
    y2="9"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="131"
    y="12"
    class="legend"
  >
    Daily
  </text>

  <line
    x1="164"
    y1="9"
    x2="173"
    y2="9"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="177"
    y="12"
    class="legend"
  >
    Total
  </text>


  <!-- ======================================================
       Нижняя базовая линия
       ====================================================== -->

  <line
    x1="36"
    y1="98"
    x2="238"
    y2="98"
    stroke="#e2e8f0"
    stroke-width="1"
  />


  <!-- ======================================================
       Daily
       ====================================================== -->

  <polyline
    points="36.0,95.7 51.5,84.1 67.1,93.4 82.6,95.7 98.2,84.1 113.7,24.0 129.2,95.7 144.8,95.7 160.3,54.1 175.8,63.3 191.4,93.4 206.9,91.1 222.5,63.3 238.0,74.9"
    fill="none"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="74.9"
    r="2.5"
    fill="#2563eb"
  />


  <!-- ======================================================
       Total
       ====================================================== -->

  <polyline
    points="36.0,97.4 51.5,93.5 67.1,92.2 82.6,91.5 98.2,87.6 113.7,66.8 129.2,66.2 144.8,65.5 160.3,53.2 175.8,43.5 191.4,42.2 206.9,40.2 222.5,30.5 238.0,24.0"
    fill="none"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="24.0"
    r="2.5"
    fill="#64748b"
  />


  <!-- ======================================================
       Конечные значения
       
       ВАЖНО:
       подписи находятся СПРАВА от точек, а не слева.
       
       latest_x + 6 гарантирует зазор между точкой и текстом.
       Дополнительный PADDING_RIGHT гарантирует, что текст
       остаётся внутри SVG.
       ====================================================== -->

  <text
    x="244.0"
    y="77.9"
    class="daily-value"
  >
    10
  </text>

  <text
    x="244.0"
    y="27.0"
    class="total-value"
  >
    114
  </text>


  <!-- ======================================================
       Даты
       ====================================================== -->

  <text
    x="36"
    y="113"
    class="label"
  >
    2026-10-07
  </text>

  <text
    x="238"
    y="113"
    text-anchor="end"
    class="label"
  >
    2026-10-20
  </text>

</svg>
