<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub clones"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #475569;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      fill: #94a3b8;
    }

    .legend {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #475569;
    }

    .daily-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #2563eb;
    }

    .total-value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #64748b;
    }
  </style>

  <!-- ======================================================
       Заголовок
       ====================================================== -->

  <text
    x="36"
    y="13"
    class="title"
  >
    GitHub clones
  </text>


  <!-- ======================================================
       Легенда
       ====================================================== -->

  <line
    x1="118"
    y1="9"
    x2="127"
    y2="9"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="131"
    y="12"
    class="legend"
  >
    Daily
  </text>

  <line
    x1="164"
    y1="9"
    x2="173"
    y2="9"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
  />

  <text
    x="177"
    y="12"
    class="legend"
  >
    Total
  </text>


  <!-- ======================================================
       Нижняя базовая линия
       ====================================================== -->

  <line
    x1="36"
    y1="98"
    x2="238"
    y2="98"
    stroke="#e2e8f0"
    stroke-width="1"
  />


  <!-- ======================================================
       Daily
       ====================================================== -->

  <polyline
    points="36.0,53.6 51.5,93.1 67.1,93.1 82.6,63.5 98.2,53.6 113.7,83.2 129.2,88.1 144.8,24.0 160.3,48.7 175.8,93.1 191.4,73.3 206.9,68.4 222.5,93.1 238.0,33.9"
    fill="none"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="33.9"
    r="2.5"
    fill="#2563eb"
  />


  <!-- ======================================================
       Total
       ====================================================== -->

  <polyline
    points="36.0,90.0 51.5,89.1 67.1,88.2 82.6,82.0 98.2,73.9 113.7,71.3 129.2,69.5 144.8,56.1 160.3,47.2 175.8,46.3 191.4,41.8 206.9,36.5 222.5,35.6 238.0,24.0"
    fill="none"
    stroke="#64748b"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238.0"
    cy="24.0"
    r="2.5"
    fill="#64748b"
  />


  <!-- ======================================================
       Конечные значения
       
       ВАЖНО:
       подписи находятся СПРАВА от точек, а не слева.
       
       latest_x + 6 гарантирует зазор между точкой и текстом.
       Дополнительный PADDING_RIGHT гарантирует, что текст
       остаётся внутри SVG.
       ====================================================== -->

  <text
    x="244.0"
    y="42.9"
    class="daily-value"
  >
    13
  </text>

  <text
    x="244.0"
    y="21.0"
    class="total-value"
  >
    83
  </text>


  <!-- ======================================================
       Даты
       ====================================================== -->

  <text
    x="36"
    y="113"
    class="label"
  >
    2026-09-16
  </text>

  <text
    x="238"
    y="113"
    text-anchor="end"
    class="label"
  >
    2026-09-29
  </text>

</svg>
