<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub views"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #475569;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      fill: #94a3b8;
    }

    .value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #2563eb;
    }
  </style>

  <text
    x="36"
    y="13"
    class="title"
  >
    GitHub views
  </text>

  <line
    x1="36"
    y1="98"
    x2="238"
    y2="98"
    stroke="#e2e8f0"
    stroke-width="1"
  />

  <polyline
    points="36.0,93.2 51.5,88.5 67.1,88.5 82.6,93.2 98.2,95.6 113.7,93.2 129.2,78.9 144.8,86.1 160.3,90.8 175.8,95.6 191.4,88.5 206.9,24.0 222.5,81.3 238.0,78.9"
    fill="none"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238"
    cy="78.9"
    r="2.5"
    fill="#2563eb"
  />

  <!--
    Значение находится СПРАВА от конечной точки.

    Это возможно благодаря увеличенному PADDING_RIGHT.
    Поэтому текст больше не пересекается с линией.
  -->
  <text
    x="244"
    y="81.9"
    class="value"
  >
    8
  </text>

  <text
    x="36"
    y="113"
    class="label"
  >
    2026-09-16
  </text>

  <text
    x="238"
    y="113"
    text-anchor="end"
    class="label"
  >
    2026-09-29
  </text>

</svg>
