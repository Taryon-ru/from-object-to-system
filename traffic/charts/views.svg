<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub views"
>
  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #333;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 8px;
      fill: #888;
    }

    .value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #333;
    }

    .line {
      fill: none;
      stroke: #315a9b;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .point {
      fill: #315a9b;
    }
  </style>

  <text
    x="36"
    y="16"
    class="title"
  >
    GitHub views
  </text>

  <polyline
    points="36.0,98.0 54.0,98.0 72.0,98.0 90.0,98.0 108.0,98.0 126.0,98.0 144.0,98.0 162.0,98.0 180.0,98.0 198.0,98.0 216.0,24.0 234.0,24.3 252.0,40.0 270.0,33.5"
    class="line"
  />

  <circle
    cx="270.0"
    cy="33.5"
    r="2.5"
    class="point"
  />

  <text
    x="242.0"
    y="37.5"
    class="value"
  >
    392
  </text>

  <text
    x="36"
    y="112"
    class="label"
  >
    2026-07-27
  </text>

  <text
    x="270"
    y="112"
    text-anchor="end"
    class="label"
  >
    2026-08-09
  </text>
</svg>
