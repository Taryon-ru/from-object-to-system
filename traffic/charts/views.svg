<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub views"
>
  <style>
    .title {
      font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #1f2937;
    }

    .label {
      font: 400 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #6b7280;
    }

    .grid {
      stroke: #e5e7eb;
      stroke-width: 1;
    }

    .line {
      fill: none;
      stroke: #1f4b99;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .point {
      fill: #1f4b99;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #f3f4f6;
      }

      .label {
        fill: #9ca3af;
      }

      .grid {
        stroke: #374151;
      }

      .line {
        stroke: #6ea8ff;
      }

      .point {
        fill: #6ea8ff;
      }
    }
  </style>

  <text
    x="36"
    y="22"
    class="title"
  >GitHub views</text>

  <line
    x1="36"
    y1="102"
    x2="270"
    y2="102"
    class="grid"
  />

  <line
    x1="36"
    y1="62.0"
    x2="270"
    y2="62.0"
    class="grid"
  />

  <line
    x1="36"
    y1="22"
    x2="270"
    y2="22"
    class="grid"
  />

  <polyline
