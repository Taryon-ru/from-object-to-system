<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub views"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #475569;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      fill: #94a3b8;
    }

    .value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #2563eb;
    }
  </style>

  <text
    x="36"
    y="13"
    class="title"
  >
    GitHub views
  </text>

  <line
    x1="36"
    y1="98"
    x2="238"
    y2="98"
    stroke="#e2e8f0"
    stroke-width="1"
  />

  <polyline
    points="36.0,85.7 51.5,40.4 67.1,61.0 82.6,65.1 98.2,85.7 113.7,89.8 129.2,56.9 144.8,73.3 160.3,81.6 175.8,85.7 191.4,24.0 206.9,73.3 222.5,65.1 238.0,85.7"
    fill="none"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238"
    cy="85.7"
    r="2.5"
    fill="#2563eb"
  />

  <!--
    Значение находится СПРАВА от конечной точки.

    Это возможно благодаря увеличенному PADDING_RIGHT.
    Поэтому текст больше не пересекается с линией.
  -->
  <text
    x="244"
    y="88.7"
    class="value"
  >
    3
  </text>

  <text
    x="36"
    y="113"
    class="label"
  >
    2026-09-01
  </text>

  <text
    x="238"
    y="113"
    text-anchor="end"
    class="label"
  >
    2026-09-14
  </text>

</svg>
