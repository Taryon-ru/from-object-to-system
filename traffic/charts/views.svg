<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub views"
>

  <style>
    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #475569;
    }

    .label {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      fill: #94a3b8;
    }

    .value {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #2563eb;
    }
  </style>

  <text
    x="36"
    y="13"
    class="title"
  >
    GitHub views
  </text>

  <line
    x1="36"
    y1="98"
    x2="238"
    y2="98"
    stroke="#e2e8f0"
    stroke-width="1"
  />

  <polyline
    points="36.0,96.2 51.5,90.6 67.1,40.6 82.6,85.0 98.2,83.2 113.7,79.5 129.2,81.3 144.8,92.5 160.3,92.5 175.8,96.2 191.4,88.8 206.9,37.0 222.5,77.7 238.0,24.0"
    fill="none"
    stroke="#2563eb"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="238"
    cy="24.0"
    r="2.5"
    fill="#2563eb"
  />

  <!--
    Значение находится СПРАВА от конечной точки.

    Это возможно благодаря увеличенному PADDING_RIGHT.
    Поэтому текст больше не пересекается с линией.
  -->
  <text
    x="244"
    y="27.0"
    class="value"
  >
    40
  </text>

  <text
    x="36"
    y="113"
    class="label"
  >
    2026-09-25
  </text>

  <text
    x="238"
    y="113"
    text-anchor="end"
    class="label"
  >
    2026-10-08
  </text>

</svg>
