<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 300"
  width="900"
  height="300"
  role="img"
  aria-label="GitHub views"
>
  <style>
    .title {
      font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #1f2937;
    }

    .label {
      font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #6b7280;
    }

    .grid {
      stroke: #e5e7eb;
      stroke-width: 1;
    }

    .line {
      fill: none;
      stroke: #1f4b99;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .point {
      fill: #1f4b99;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #f3f4f6;
      }

      .label {
        fill: #9ca3af;
      }

      .grid {
        stroke: #374151;
      }

      .line {
        stroke: #6ea8ff;
      }

      .point {
        fill: #6ea8ff;
      }
    }
  </style>

  <text
    x="60"
    y="28"
    class="title"
  >GitHub views</text>

  <line
    x1="60"
    y1="258"
    x2="876"
    y2="258"
    class="grid"
  />

  <line
    x1="60"
    y1="153.0"
    x2="876"
    y2="153.0"
    class="grid"
  />

  <line
    x1="60"
    y1="48"
    x2="876"
    y2="48"
    class="grid"
  />

  <polyline
    points="60.0,258.0 122.8,258.0 185.5,258.0 248.3,258.0 311.1,258.0 373.8,258.0 436.6,258.0 499.4,258.0 562.2,258.0 624.9,258.0 687.7,258.0 750.5,48.0 813.2,48.9 876.0,93.3"
    class="line"
  />

  <circle
    cx="876.0"
    cy="93.3"
    r="4"
    class="point"
  />

  <text
    x="60"
    y="288"
    class="label"
