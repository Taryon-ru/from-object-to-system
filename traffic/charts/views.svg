<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 280 120"
  width="280"
  height="120"
  role="img"
  aria-label="GitHub views"
>
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #1f2937;
    }

    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 8px;
      fill: #6b7280;
    }

    .grid {
      stroke: #e5e7eb;
      stroke-width: 1;
    }

    .line {
      fill: none;
      stroke: #315f9f;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #e5e7eb;
      }

      .label {
        fill: #9ca3af;
      }

      .grid {
        stroke: #374151;
      }

      .line {
        stroke: #8fb5e8;
      }
    }
  </style>

  <text
    x="36"
    y="22"
    class="title"
  >GitHub views</text>

  <line
    x1="36"
    y1="98"
    x2="244"
    y2="98"
    class="grid"
  />

  <polyline
    points="36.0,98.0 52.0,98.0 68.0,98.0 84.0,98.0 100.0,98.0 116.0,98.0 132.0,98.0 148.0,98.0 164.0,98.0 180.0,98.0 196.0,24.0 212.0,24.3 228.0,40.0 244.0,33.5"
    class="line"
  />

  <text
    x="36"
    y="108"
    class="label"
  >2026-07-27</text>

  <text
    x="244"
    y="108"
    text-anchor="end"
    class="label"
  >2026-08-09</text>

  <text
    x="244"
    y="14"
    text-anchor="end"
    class="label"
  >392</text>
</svg>
